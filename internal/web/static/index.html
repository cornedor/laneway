// Theme before first paint: no flash.
try{var t=localStorage.getItem('lw:theme');if(t)document.documentElement.dataset.theme=t;var a=localStorage.getItem('lw:accent');if(a)document.documentElement.style.setProperty('--accent',a);var d=localStorage.getItem('lw:density');if(d)document.documentElement.dataset.density=d}catch(e){}
</script>

<a class="skip" href="#view" onclick="event.preventDefault();document.getElementById('view').focus()">Skip to content</a>

    <a class="brand" href="#/board">laneway</a>
    <nav id="nav" aria-label="Views"></nav>
    <div id="toolbar"></div>
    <button id="search-btn" class="btn ghost" title="Command palette (:)">⌘ <kbd>:</kbd></button>
  </header>
  <div id="body">
    <main id="view" tabindex="-1"></main>
    <aside id="panel" aria-label="Issue" hidden></aside>
  </div>
