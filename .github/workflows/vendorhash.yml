name: vendorHash

# Dependabot's Go bumps leave flake.nix's vendorHash stale; fix it on the PR.
on:
  pull_request:
    paths: [go.mod, go.sum]

permissions:
  contents: write
  actions: write

jobs:
  update:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.head_ref }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: cachix/install-nix-action@v31
      - name: update vendorHash
        run: |
          got=$(nix build .#laneway 2>&1 | sed -n 's/^ *got: *//p')
          [ -n "$got" ] || exit 0
          sed -i "s|vendorHash = \".*\";|vendorHash = \"$got\";|" flake.nix
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "nix: update vendorHash"
          git push origin "HEAD:$BRANCH"
          # Pushes with GITHUB_TOKEN don't trigger CI; dispatch it for the new head.
          gh workflow run ci.yml --ref "$BRANCH"
