name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  desktop:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: desktop/build-mac.sh "${GITHUB_REF_NAME#v}"
      - run: gh release upload "$GITHUB_REF_NAME" desktop/dist/Laneway-mac.zip desktop/dist/Laneway-mac.zip.sha256
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
