name: AUR

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        type: choice
        options: [both, laneway, laneway-git]
        default: both

permissions:
  contents: read

concurrency:
  group: aur

jobs:
  publish:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        pkgname: [laneway, laneway-git]
    steps:
      - name: Install tooling
        run: pacman -Syu --needed --noconfirm git go openssh pacman-contrib

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >>"$GITHUB_OUTPUT"
          else
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
            echo "version=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')" >>"$GITHUB_OUTPUT"
          fi

      - name: Set up the AUR key
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          useradd -m builder
          install -d -m 700 -o builder -g builder /home/builder/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" >/home/builder/.ssh/aur
          # Pinned rather than scanned: the fingerprint aur.archlinux.org
          # publishes is SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4.
          cat >/home/builder/.ssh/known_hosts <<'EOF'
          aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
          EOF
          cat >/home/builder/.ssh/config <<'EOF'
          Host aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/aur
            IdentitiesOnly yes
          EOF
          chmod 600 /home/builder/.ssh/aur
          chown -R builder:builder /home/builder/.ssh

      - name: Publish ${{ matrix.pkgname }}
        if: github.event_name == 'push' || inputs.package == 'both' || inputs.package == matrix.pkgname
        env:
          # The -git package versions itself from the branch it tracks.
          VERSION: ${{ matrix.pkgname == 'laneway' && steps.version.outputs.version || '' }}
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          sudo -u builder git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sudo -u builder bash packaging/aur/publish.sh '${{ matrix.pkgname }}' "$VERSION"
